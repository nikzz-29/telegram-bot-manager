[project]
name = "tg-bot-manager"
version = "0.1.0"
description = "Multitenant Telegram bot manager SaaS"
requires-python = ">=3.12"
dependencies = [
  "tg-manager-api",
  "tg-manager-bot",
  "tg-manager-worker",
  "tg-manager-core",
  "tg-manager-db",
  "tg-manager-i18n",
  "tg-manager-shared",
]

[tool.uv.workspace]
members = ["apps/api", "apps/bot", "apps/worker", "packages/*"]

[tool.uv.sources]
tg-manager-api = { workspace = true }
tg-manager-bot = { workspace = true }
tg-manager-worker = { workspace = true }
tg-manager-core = { workspace = true }
tg-manager-db = { workspace = true }
tg-manager-i18n = { workspace = true }
tg-manager-shared = { workspace = true }

[dependency-groups]
dev = [
  "alembic>=1.13.2,<1.19",
  "mypy>=1.14,<2",
  "pre-commit>=3.8.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.2",
  "psycopg2-binary>=2.9.9",
  "httpx>=0.27.0",
  "fakeredis>=2.24.1",
  "testcontainers[postgres,redis]>=4.8.1",
  "pathspec>=1.0.0,<1.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages", "tests"]
exclude = ["PROMPT.md", ".venv", "apps/miniapp", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PIE", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Workspace packages live under packages/*/src, which ruff cannot infer from
# `src`; naming them keeps intra-project imports in one sorted block.
known-first-party = ["shared", "db", "core", "i18n", "api", "bot", "worker"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/shared/src:packages/db/src:packages/core/src:packages/i18n/src:apps/api/src:apps/bot/src:apps/worker/src"
packages = ["shared", "db", "core", "i18n", "api", "bot", "worker"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# `mako` arrives with alembic and ships no py.typed; `tests/test_migrations.py`
# renders the revision template through it.
module = ["fluent.*", "aiocryptopay.*", "cashews.*", "arq.*", "mako.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["packages", "apps"]
