[project]
name = "tg-manager-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13.1",
  # The webhook runner serves aiogram's handler on its own aiohttp app. aiogram
  # depends on aiohttp anyway, but `bot.runner` imports it directly, so it is
  # declared directly.
  "aiohttp>=3.10",
  "redis>=5.0.8",
  "arq>=0.26.1",
  "cashews>=7.1.0",
  "structlog>=24.4.0",
  "tg-manager-core",
  "tg-manager-shared",
  "tg-manager-db",
  "tg-manager-i18n",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
tg-manager-core = { workspace = true }
tg-manager-shared = { workspace = true }
tg-manager-db = { workspace = true }
tg-manager-i18n = { workspace = true }
