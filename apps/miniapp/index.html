<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!--
      Without this, a mobile webview lays the panel out at ~980px and scales the
      result down: every font, row and tap target renders shrunken and slightly
      blurred, which reads as "unstyled" no matter what the stylesheet says.
      `viewport-fit=cover` lets the safe-area insets in `index.css` reach under
      the notch instead of leaving a band of background there.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Telegram paints the webview's surround before the SDK answers; matching
         it to our own background stops the white flash on a dark theme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Панель управления</title>
    <style>
      /* First paint lives in HTML so a slow Telegram webview never shows an
         empty page while the application bundle is still downloading. */
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f3f3f1; color-scheme: light dark; }
      .boot-screen {
        display: grid; min-height: 100dvh; place-items: center; overflow: hidden; color: #111113;
      }
      .boot-lockup {
        display: grid; place-items: center; gap: 1rem;
      }
      .boot-logo-frame {
        display: grid; width: 5.5rem; height: 5.5rem; place-items: center; overflow: hidden;
        border: 1px solid rgb(17 17 19 / 10%); border-radius: 18px; background: #fff;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 55%), 0 18px 46px rgb(17 17 19 / 7%);
        animation: boot-float 2.8s ease-in-out infinite;
      }
      .boot-grid {
        display: grid; width: 3.6rem; height: 3.6rem; grid-template-columns: repeat(3, 1fr);
        gap: .24rem; transform: rotate(45deg);
      }
      .boot-grid i { display: block; aspect-ratio: 1; background: currentColor; animation: boot-cell 1.45s cubic-bezier(.2,0,.2,1) infinite; }
      .boot-grid i:nth-child(2), .boot-grid i:nth-child(4), .boot-grid i:nth-child(6), .boot-grid i:nth-child(8) { animation-delay: 110ms; }
      .boot-grid i:nth-child(3), .boot-grid i:nth-child(5), .boot-grid i:nth-child(7), .boot-grid i:nth-child(9) { animation-delay: 220ms; }
      .boot-grid i:nth-child(5) { animation-delay: 330ms; }
      .boot-wordmark { font: 800 .7rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-progress { position: relative; width: 4.5rem; height: 2px; overflow: hidden; border-radius: 99px; background: rgb(107 107 114 / 20%); }
      .boot-progress span { position: absolute; inset: 0 auto 0 -35%; width: 35%; border-radius: inherit; background: currentColor; animation: boot-progress 1.1s cubic-bezier(.2,0,.2,1) infinite; }
      @keyframes boot-float { 50% { transform: translateY(-5px) rotate(1deg); } }
      @keyframes boot-cell { 0%,100% { opacity:.5; transform:scale(.3); } 45%,60% { opacity:1; transform:scale(1); } }
      @keyframes boot-progress { to { transform: translateX(385%); } }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0b0d; }
        .boot-screen { color: #f5f5f4; }
        .boot-logo-frame { border-color: rgb(245 245 244 / 13%); background: #171719; box-shadow: none; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-logo-frame, .boot-grid i, .boot-progress span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-label="Загрузка панели">
        <div class="boot-lockup" aria-hidden="true">
          <div class="boot-logo-frame">
            <span class="boot-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="boot-wordmark">BOT MANAGER</div>
          <div class="boot-progress"><span></span></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
