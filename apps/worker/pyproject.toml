[project]
name = "tg-manager-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26.1",
  "redis>=5.0.8",
  "aiogram>=3.13.1",
  "cashews>=7.1.0",
  "structlog>=24.4.0",
  "tg-manager-shared",
  "tg-manager-db",
  "tg-manager-core",
  "tg-manager-i18n",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
tg-manager-shared = { workspace = true }
tg-manager-db = { workspace = true }
tg-manager-core = { workspace = true }
tg-manager-i18n = { workspace = true }
