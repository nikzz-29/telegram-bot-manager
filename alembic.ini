[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# The real URL comes from Settings.database_url in env.py; this is only a
# placeholder so `alembic` runs without an environment.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5433/tg_manager
