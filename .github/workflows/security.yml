name: Dependency security

on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Audit locked dependencies
        # aiocryptopay currently pins certifi<2024. The exception is narrow and
        # tracked by Dependabot; any other advisory must fail this job.
        run: |
          uv export --frozen --no-dev --no-emit-workspace > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --ignore-vuln PYSEC-2024-230

  miniapp:
    name: Mini App audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/miniapp/pnpm-lock.yaml
      - working-directory: apps/miniapp
        run: pnpm install --frozen-lockfile
      - working-directory: apps/miniapp
        run: pnpm audit --prod --audit-level high
