# The Mini App and API deliberately share one origin. This removes CORS and
# mixed-content surprises and gives Cloudflare Tunnel one stable local target.
map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    # Docker may assign a different address when `api` or `bot` is recreated.
    # Resolve service names at request time instead of keeping the address that
    # happened to exist when Nginx started. Variables also let Nginx start while
    # the optional webhook listener is absent (polling mode).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8000;
    set $bot_upstream bot:8081;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # The generated Vite assets are content-hashed and can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Preserve `/api/...` exactly: FastAPI mounts its public routers below that
    # prefix and the Mini App uses relative same-origin URLs.
    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_read_timeout 60s;
    }

    # CryptoBot calls this path directly; it intentionally lives outside `/api`.
    location = /payments/cryptobot/webhook {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
    }

    # Optional production Telegram webhook. In polling mode the route is never
    # called, but keeping it here makes switching modes a configuration change.
    location = /telegram/webhook {
        proxy_pass http://$bot_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }

    # React navigation is client-side: unknown non-API paths must return the
    # application shell rather than an Nginx 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
