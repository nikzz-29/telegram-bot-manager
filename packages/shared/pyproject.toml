[project]
name = "tg-manager-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.2", "pydantic-settings>=2.4.0", "structlog>=24.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
